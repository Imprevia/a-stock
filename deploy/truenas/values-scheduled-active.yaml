# Reviewed --activate-schedule candidate only. Applying this overlay requires
# canary evidence recorded against the dedicated --activate-schedule entry
# point; it is never selected automatically. controllerCanaryVerified=true
# is required by the chart validator before suspend flips to false.
# Schedule and controllerTimeZone reflect the live TrueNAS k3s 1.26.6 controller.
marketEnvironment:
  scheduledCollection:
    enabled: true
    suspend: false
    timezoneStrategy: controller
    timeZone: Asia/Shanghai
    schedule: "30 16 * * 1-5"
    controllerTimeZone: Asia/Shanghai
    controllerTimeZoneVerified: true
    controllerCanaryVerified: true

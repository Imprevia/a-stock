replicaCount: 1

image:
  repository: localhost/a-stock-market-environment
  tag: 20260905-1904b66
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  nodePort: 32001

ingress:
  enabled: false

database:
  enabled: true
  existingSecret: a-stock-postgresql

persistence:
  enabled: true
  existingClaim: a-stock-data
  mountPath: /data
  keep: true

marketEnvironment:
  timezone: Asia/Shanghai
  persistentCache: true
  settlementTime: "15:10"
  limits:
    v1Enabled: true
    fuyao:
      # The credential is injected from the independent Kubernetes Secret.
      existingSecret: a-stock-market-provider
      secretKey: MARKET_ENVIRONMENT_FUYAO_API_KEY
  scheduledCollection:
    enabled: false
    suspend: true

extraEnv:
  - name: MARKET_ENVIRONMENT_MANUAL_REFRESH_ENABLED
    value: "1"

apiVersion: batch/v1
kind: CronJob
# Operator override for the verified Asia/Shanghai controller on TrueNAS k3s 1.26.
# This resource is intentionally outside the Helm release and must not be used
# when the controller timezone evidence changes.
metadata:
  name: market-data-collection
  namespace: a-stock
  labels:
    app.kubernetes.io/name: market-data-collection
    app.kubernetes.io/part-of: a-stock
    app.kubernetes.io/component: data-collection
spec:
  schedule: "30 16 * * 1-5"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-data-collection
            app.kubernetes.io/part-of: a-stock
            app.kubernetes.io/component: data-collection
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              image: localhost/a-stock-market-environment:20260906-005226-2075b6e
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - src.market_environment.cli
                - snapshots
                - scheduled-refresh
              env:
                - name: TZ
                  value: Asia/Shanghai
                - name: MARKET_ENVIRONMENT_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: a-stock-postgresql
                      key: DATABASE_URL
                - name: MARKET_ENVIRONMENT_DATABASE_HOST
                  value: market-environment-postgresql
                - name: MARKET_ENVIRONMENT_DATABASE_PORT
                  value: "5432"
                - name: MARKET_ENVIRONMENT_DATABASE_NAME
                  valueFrom:
                    secretKeyRef:
                      name: a-stock-postgresql
                      key: POSTGRES_DB
                - name: MARKET_ENVIRONMENT_DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: a-stock-postgresql
                      key: POSTGRES_USER
                - name: MARKET_ENVIRONMENT_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: a-stock-postgresql
                      key: POSTGRES_PASSWORD
                - name: MARKET_ENVIRONMENT_DATABASE_SSLMODE
                  value: prefer
                - name: MARKET_ENVIRONMENT_PERSISTENT_CACHE
                  value: "1"
                - name: MARKET_ENVIRONMENT_SETTLEMENT_TIME
                  value: "15:10"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}

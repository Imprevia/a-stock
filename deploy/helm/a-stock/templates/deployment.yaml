{{- $component := default "all" .Values.component -}}
{{- if not (has $component (list "all" "database" "service" "schedule")) -}}
{{- fail (printf "component=%s is not supported; expected one of all, database, service, or schedule" $component) -}}
{{- end -}}
{{- if has $component (list "all" "service") }}
{{- if or (not .Values.database.enabled) (not .Values.database.existingSecret) }}
{{- fail "database.existingSecret is required and database.enabled=true for the Dashboard Deployment" }}
{{- end }}
{{- if and .Values.marketEnvironment.limits.fuyao.existingSecret (eq .Values.marketEnvironment.limits.fuyao.existingSecret .Values.database.existingSecret) }}
{{- fail "marketEnvironment.limits.fuyao.existingSecret must be independent from database.existingSecret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "a-stock.fullname" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "a-stock.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "a-stock.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "a-stock.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: a-stock
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.marketEnvironment.timezone | quote }}
            - name: MARKET_ENVIRONMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKeys.url }}
            - name: MARKET_ENVIRONMENT_DATABASE_HOST
              value: {{ include "a-stock.postgresqlName" . | quote }}
            - name: MARKET_ENVIRONMENT_DATABASE_PORT
              value: {{ .Values.database.service.port | quote }}
            - name: MARKET_ENVIRONMENT_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKeys.database }}
            - name: MARKET_ENVIRONMENT_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKeys.username }}
            - name: MARKET_ENVIRONMENT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKeys.password }}
            - name: MARKET_ENVIRONMENT_DATABASE_SSLMODE
              value: {{ .Values.marketEnvironment.database.sslMode | quote }}
            - name: MARKET_ENVIRONMENT_DB_POOL_SIZE
              value: {{ .Values.marketEnvironment.database.poolSize | quote }}
            - name: MARKET_ENVIRONMENT_DB_MAX_OVERFLOW
              value: {{ .Values.marketEnvironment.database.maxOverflow | quote }}
            - name: MARKET_ENVIRONMENT_DB_POOL_TIMEOUT
              value: {{ .Values.marketEnvironment.database.poolTimeoutSeconds | quote }}
            - name: MARKET_ENVIRONMENT_DB_STATEMENT_TIMEOUT_MS
              value: {{ .Values.marketEnvironment.database.statementTimeoutMs | quote }}
            - name: MARKET_ENVIRONMENT_PERSISTENT_CACHE
              value: {{ ternary "1" "0" .Values.marketEnvironment.persistentCache | quote }}
            - name: MARKET_ENVIRONMENT_SETTLEMENT_TIME
              value: {{ .Values.marketEnvironment.settlementTime | quote }}
            - name: MARKET_ENVIRONMENT_LIMITS_V1_ENABLED
              value: {{ ternary "1" "0" .Values.marketEnvironment.limits.v1Enabled | quote }}
            {{- with .Values.marketEnvironment.limits.fuyao.existingSecret }}
            - name: MARKET_ENVIRONMENT_FUYAO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.marketEnvironment.limits.fuyao.secretKey | quote }}
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
{{- end }}

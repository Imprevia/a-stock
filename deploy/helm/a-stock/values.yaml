replicaCount: 1

image:
  repository: a-stock-market-environment
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  host: ""
  path: /
  pathType: Prefix
  tls: []
  # tls:
  #   - secretName: a-stock-tls
  #     hosts:
  #       - stock.example.com

persistence:
  enabled: true
  existingClaim: ""
  storageClass: local-path
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  mountPath: /data
  keep: true
  annotations: {}

marketEnvironment:
  timezone: Asia/Shanghai
  snapshotPath: /data/snapshots.sqlite3
  persistentCache: true
  settlementTime: "15:10"
  scheduledCollection:
    enabled: true
    suspend: false
    schedule: "30 16 * * 1-5"
    timeZone: Asia/Shanghai
    startingDeadlineSeconds: 1800
    activeDeadlineSeconds: 3600
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    extraEnv: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    priorityClassName: ""

startupProbe:
  enabled: true
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 30

readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  enabled: true
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3

extraEnv: []
extraVolumeMounts: []
extraVolumes: []

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

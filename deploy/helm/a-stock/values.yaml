replicaCount: 1

image:
  repository: a-stock-market-environment
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Component intent for the TrueNAS k3s entry point.
#   all       - render every supported resource (legacy default)
#   database  - render only the reviewed RWO PVC contract
#   service   - render the Dashboard Deployment, Service, and configured Ingress
#   schedule  - render only the scheduled-collection resource when the
#               reviewed suspended/disabled profile allows it
component: all

# PostgreSQL is the runtime store. Credentials must be supplied through a
# pre-created Secret; the chart never renders passwords or creates a Secret.
database:
  enabled: true
  image:
    repository: postgres
    tag: "16.4"
    # Pinned linux/amd64 manifest digest for postgres:16.4.
    digest: "sha256:9a70e4d1c03a5066080292db2dd95ee3965d3651316e21989fa0935afb8ce8ca"
    pullPolicy: IfNotPresent
  existingSecret: ""
  secretKeys:
    url: DATABASE_URL
    username: POSTGRES_USER
    password: POSTGRES_PASSWORD
    database: POSTGRES_DB
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    mountPath: /var/lib/postgresql/data
    keep: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  migration:
    enabled: false
    sourceClaim: ""
    sourcePath: /data/snapshots.sqlite3
    backupPath: /tmp/snapshots-before-postgresql.sqlite3
    apply: false
    schemaEnabled: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  nodePort: null

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  host: ""
  path: /
  pathType: Prefix
  tls: []
  # tls:
  #   - secretName: a-stock-tls
  #     hosts:
  #       - stock.example.com

persistence:
  enabled: true
  existingClaim: ""
  storageClass: local-path
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  mountPath: /data
  keep: true
  annotations: {}

marketEnvironment:
  timezone: Asia/Shanghai
  persistentCache: true
  database:
    sslMode: prefer
    poolSize: 5
    maxOverflow: 5
    poolTimeoutSeconds: 10
    statementTimeoutMs: 30000
  settlementTime: "15:10"
  scheduledCollection:
    enabled: false
    suspend: true
    schedule: "30 16 * * 1-5"
    timezoneStrategy: native
    timeZone: Asia/Shanghai
    controllerTimeZone: ""
    controllerTimeZoneVerified: false
    controllerCanaryVerified: false
    startingDeadlineSeconds: 1800
    activeDeadlineSeconds: 3600
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    extraEnv: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    priorityClassName: ""

startupProbe:
  enabled: true
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 30

readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  enabled: true
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3

extraEnv: []
extraVolumeMounts: []
extraVolumes: []

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

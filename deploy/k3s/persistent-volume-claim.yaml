apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-environment-data
  labels:
    app.kubernetes.io/name: market-environment-dashboard
    app.kubernetes.io/part-of: a-stock
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

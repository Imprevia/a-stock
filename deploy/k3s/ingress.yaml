apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: market-environment-dashboard
  labels:
    app.kubernetes.io/name: market-environment-dashboard
    app.kubernetes.io/part-of: a-stock
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: market-environment-dashboard
                port:
                  name: http

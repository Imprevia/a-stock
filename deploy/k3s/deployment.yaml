apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-environment-dashboard
  labels:
    app.kubernetes.io/name: market-environment-dashboard
    app.kubernetes.io/part-of: a-stock
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: market-environment-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-environment-dashboard
        app.kubernetes.io/part-of: a-stock
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: a-stock-market-environment:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: MARKET_ENVIRONMENT_SNAPSHOT_PATH
              value: /data/snapshots.sqlite3
            - name: MARKET_ENVIRONMENT_PERSISTENT_CACHE
              value: "1"
            - name: MARKET_ENVIRONMENT_SETTLEMENT_TIME
              value: "15:10"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: market-environment-data
        - name: tmp
          emptyDir: {}

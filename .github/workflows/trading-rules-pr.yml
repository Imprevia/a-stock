name: Trading Rules PR Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-rule-gate:
    runs-on: ubuntu-latest
    env:
      TRADING_RULES_OFFLINE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate registry and documentation coverage
        run: |
          python -m src.trading_system.cli rules validate
          python -m src.trading_system.cli rules coverage
          python -m src.trading_system.cli docs sync-check
      - name: Run deterministic tests
        run: python -m pytest tests -q
      - name: Run full docs contract
        run: python scripts/check-docs-contract.py --mode=full
